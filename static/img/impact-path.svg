<svg id="cf-path-svg" xmlns="http://www.w3.org/2000/svg" viewBox="3.85 339.89 902.3 66.28">
  <style>
    .cls-1, .cls-2 {
      fill: none;
      stroke: #e0060a;
      stroke-miterlimit: 10;
      stroke-linecap: round;
    }
    .cls-2 {
      stroke-dasharray: 3 3;
      animation: cf-dash-flow 1.1s linear infinite;
    }
    .cls-3 {
      fill: #e0060a;
      transform-box: fill-box;
      transform-origin: center;
      animation: cf-arrow-pulse 1.1s ease-in-out infinite;
    }
    @keyframes cf-dash-flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -12; }
    }
    @keyframes cf-arrow-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }
  </style>
